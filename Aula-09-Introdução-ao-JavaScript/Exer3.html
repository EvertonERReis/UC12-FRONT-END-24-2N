<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Exercícios - Parte 3: Manipulação do DOM</title>
    <link rel="stylesheet" href="./css/style3.css">
</head>
<body>
    
<h2>Lista de Tarefas</h2>

<!-- 1. campo de texto -->
<input id="campoTarefa" type="text" placeholder="Digite sua tarefa">

<!-- 2. botão "Adicionar" -->
<button id="btnAdicionar">Adicionar</button>

<!-- 3. lista vazia -->
<ul id="listaTarefas"></ul>

<script>
  // --- SELECIONAR OS ELEMENTOS ---
  // Pega referência do input, botão e ul para usar no código
  const campo = document.getElementById('campoTarefa');
  const botao = document.getElementById('btnAdicionar');
  const lista = document.getElementById('listaTarefas');

  // --- FUNÇÃO PRINCIPAL: adiciona tarefa ---
  function adicionarTarefa() {
    // 1) pega o valor atual do input e remove espaços nas pontas
    const texto = campo.value.trim();

    // 2) valida: se estiver vazio, não adiciona
    if (texto === '') {
      // opcional: você pode mostrar uma mensagem de erro ou apenas retornar
      // alert('Digite uma tarefa antes de adicionar.');
      return; // sai da função sem fazer nada
    }

    // 3) cria um novo elemento <li>
    const novoItem = document.createElement('li');

    // 4) coloca o texto dentro do <li>
    // Usamos textContent para evitar inserir HTML acidentalmente
    novoItem.textContent = texto;

    // 5) adiciona o <li> à lista (<ul>)
    lista.appendChild(novoItem);

    // 6) limpa o input e devolve o foco para o usuário (pronto para próxima tarefa)
    campo.value = '';
    campo.focus();
  }

  // --- EVENTOS ---
  // Quando o botão for clicado, chama adicionarTarefa
  botao.addEventListener('click', adicionarTarefa);

  // Dica: permitir adicionar pressionando Enter no input
  campo.addEventListener('keyup', function(event) {
    if (event.key === 'Enter') {
      adicionarTarefa();
    }
  });
</script>

</body>
</html>
