<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Introdução ao JavaScript para Front-End</title>

    <link rel="stylesheet" href="./css/style.css">

</head>
<body>

    <header>
    <div  class="centro"> 
    <button id="meuBotao">Clique-me</button>
    <p id="contador">0 cliques</p>
    </div>
    
    <script>

      const botao = document.getElementById('meuBotao');
      const contadorElemento = document.getElementById('contador');
      
      let contador = 0;

      botao.addEventListener('click', () => {
        contador++;
        contadorElemento.textContent = `${contador} cliques`;
        
        if (contador > 5) {
          botao.style.backgroundColor = 'red';
        }
        if (contador > 10) {
          botao.style.backgroundColor = 'white';
        }
        if (contador > 15) {
          botao.style.backgroundColor = 'yellow';
        }
        if (contador > 25) {
          botao.style.backgroundColor = 'purple';
        }
      });
    
    </script>
    </header>

    <header>

        <div class="centroTwo">
        <button id="btn">pode me Clicar ?</button>
        </div>

        
    <br>

    <div class="container">
        <button id="adicionar">Adicionar Item</button>
        <button id="remover">Remover Último</button>
        <ul id="lista"></ul>
      </div>

        <script>

            const btn = document.querySelector('#btn');

            btn.addEventListener('click', ()=> {
            alert("Clicado com addEventListener!")
            });    
      

        const adicionarBtn = document.getElementById('adicionar');
        const removerBtn = document.getElementById('remover');
        const lista = document.getElementById('lista');

        let contadorTwo = 1;
      
        adicionarBtn.addEventListener('click', () => {

          const novoItem = document.createElement('li');

          novoItem.textContent = `Item ${contadorTwo++}`;
          novoItem.classList.add('item-lista');
          lista.appendChild(novoItem);

        if (contadorTwo > 5) {
          adicionarBtn.style.backgroundColor = 'green';
        }


        });

      
        removerBtn.addEventListener('click', () => {
          const ultimoItem = lista.lastElementChild;
          if (ultimoItem) {
            ultimoItem.remove();
            contadorTwo--;
          }
        });
      </script>




</header>

</body>
</html>
